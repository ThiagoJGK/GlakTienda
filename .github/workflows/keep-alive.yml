name: Keep Supabase Awake

on:
  schedule:
    # Runs every day at 12:00 UTC (9:00 AM Argentina)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Allows you to manually trigger the ping from GitHub's UI

jobs:
  ping_db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
